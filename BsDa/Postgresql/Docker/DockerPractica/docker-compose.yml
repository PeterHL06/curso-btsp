
services:
  db:
    image: postgres:15
    container_name: postgres_container
    environment:
      POSTGRES_USER: usuario_test
      POSTGRES_PASSWORD: clave123
      POSTGRES_DB: escuela
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: ./app
    container_name: python_app
    depends_on:
      - db
    volumes:
      - ./app:/app
    environment:
      DB_HOST: db
      DB_NAME: escuela
      DB_USER: usuario_test
      DB_PASS: clave123

volumes:
  postgres_data:
